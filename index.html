    <!-- Boot theme: force dark by default (APK/mobile fixed dark container).
         Users who explicitly chose light are kept light; everyone else gets
         the dark surface immediately so there is no light-mode flash/white
         fallback (root cause of the invisible-white-text screenshots). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("fuelpro_theme");
          if (stored === null || stored === undefined) {
            // First run on this device: default to dark (mobile/APK fixed
            // dark container) so the app never renders white/invisible.
            localStorage.setItem("fuelpro_theme", "dark");
            stored = "dark";
          }
          var forceDark = stored !== "light";
          var root = document.documentElement;
          if (forceDark) {
            root.classList.add("dark");
            root.setAttribute("data-theme", "dark");
            document.body.style.colorScheme = "dark";
          }
          // Apply saved view-zoom + frame before first paint (no size flash).
          try {
            var zStored = localStorage.getItem("fuelpro_view_zoom");
            if (zStored !== null) {
              var zn = Number(zStored);
              if (Number.isFinite(zn)) {
                var zc = Math.min(200, Math.max(75, Math.round(zn / 5) * 5));
                root.setAttribute("data-zoom", String(zc));
                root.style.fontSize = zc + "%";
              }
            }
            var fStored = localStorage.getItem("fuelpro_frame_mode");
            if (fStored === "wide" || fStored === "full" || fStored === "device") {
              root.setAttribute("data-frame", fStored);
            }
          } catch (e2) { /* ignore */ }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- AD/POPUP/REDIRECT BLOCKER — equivalent of uBlock Origin behaviour for
         the in-app players (Movies, Live TV, Live Radio). Blocks popup
         windows, new-tab opens, and top-level navigation hijacks triggered
         by embedded third-party players. In-iframe popups/redirects are
         covered by the ad-blocker engine (window.open + network filtering +
         beforeunload redirect trap) and the MoviesEmbed hijack watchdog —
         the providers refuse sandboxed iframes, so sandbox is NOT used. -->
    <script>
      (function () {
        // 1. Neutralize popup ads while preserving legitimate share/open
        //    flows. A popup is allowed when it is triggered by a genuine user
        //    activation (navigator.userActivation.isActive — true for ~5s
        //    after a click/keypress) OR when it is same-origin. Programmatic
        //    window.open calls from ad scripts (no user gesture) are blocked.
        var origOpen = window.open;
        window.open = function (url) {
          var ua = navigator.userActivation;
          var userInitiated = !!(ua && ua.isActive);
          var sameOrigin =
            typeof url === "string" &&
            (url.charAt(0) === "/" || url.indexOf(location.origin) === 0);
          if (userInitiated || sameOrigin || !url) {
            return origOpen.apply(window, arguments);
          }
          console.warn("[ad-blocker] Blocked popup (no user gesture):", url);
          return null;
        };
        // 2. Block target=_blank clicks that originate from known ad/tracking
        //    domains inside our own DOM (defense-in-depth; the beforeunload
        //    redirect trap in ad-blocker.ts covers embed-iframe hijacks).
        document.addEventListener(
          "click",
          function (e) {
            var el =
              e.target && e.target.closest ? e.target.closest("a") : null;
            if (!el) return;
            var href = el.getAttribute("href") || "";
            if (
              /(\/ads\/|adserver|doubleclick|popads|popcash|propeller|adnxs|adsystem|trackclick|clickadu|exoclick|trafficjunky|juicyads)/i.test(
                href,
              )
            ) {
              e.preventDefault();
              e.stopPropagation();
              console.warn("[ad-blocker] Blocked ad link:", href);
            }
          },
          true,
        );
        // NOTE: top-navigation hijack protection is handled by the iframe
        // sandbox attribute (no allow-top-navigation) on the embed players.
        // A beforeunload blocker was deliberately NOT added — it would show
        // "Leave site?" dialogs whenever a media element exists on the page.
      })();
    </script>

    <!-- Prevent FOUC (Flash of Unstyled Content) - Apply theme BEFORE React loads -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("fuelpro_theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark =
            theme === "dark" ||
            (theme === "system" && prefersDark) ||
            (!theme && prefersDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
            document.body.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.add("light");
            document.documentElement.setAttribute("data-theme", "light");
            document.body.style.colorScheme = "light";
          }
        } catch (e) {}
      })();

    <script>
      // ═══════════════════════════════════════════════════════════════
      // FUELPRO RELOAD GUARD — prevents ALL infinite refresh/reload loops.
      // ═══════════════════════════════════════════════════════════════
      // Every reload path (SW controllerchange, version-check, script-error
      // self-heal, FUELPRO_RELOAD message) MUST go through safeReload().
      // safeReload checks a sessionStorage counter — if we've already
      // reloaded more than MAX_RELOADS times within the RELOAD_WINDOW,
      // the reload is SUPPRESSED and the user stays on the current page
      // instead of looping forever. The counter is cleared after a
      // successful load settles (see the "load" + setTimeout below).
      (function () {
        var MAX_RELOADS = 2; // max reloads allowed per window
        var RELOAD_WINDOW = 15000; // 15-second rolling window
        var KEY = "fuelpro_reload_count";
        var TS_KEY = "fuelpro_reload_first_ts";

        window.__fuelproSafeReload = function (reason) {
          try {
            var now = Date.now();
            var firstTs = parseInt(sessionStorage.getItem(TS_KEY) || "0", 10);
            // Reset the window if it has expired.
            if (firstTs && now - firstTs > RELOAD_WINDOW) {
              sessionStorage.setItem(KEY, "0");
              sessionStorage.setItem(TS_KEY, String(now));
              firstTs = now;
            }
            var count = parseInt(sessionStorage.getItem(KEY) || "0", 10);
            if (count >= MAX_RELOADS) {
              console.warn(
                "[reload-guard] Suppressing reload (" +
                  reason +
                  ") — limit reached (" +
                  count +
                  "/" +
                  MAX_RELOADS +
                  " in " +
                  RELOAD_WINDOW / 1000 +
                  "s). User stays on page.",
              );
              return false;
            }
            if (!firstTs) sessionStorage.setItem(TS_KEY, String(now));
            sessionStorage.setItem(KEY, String(count + 1));
            console.log(
              "[reload-guard] Reloading (" +
                reason +
                ") — attempt " +
                (count + 1) +
                "/" +
                MAX_RELOADS,
            );
            window.location.reload();
            return true;
          } catch (e) {
            // If sessionStorage is unavailable (private mode), just reload.
            window.location.reload();
            return true;
          }
        };

        // Clear the guard after the page has been stable for 5 seconds —
        // this means the load SUCCEEDED (no immediate reload) so the user
        // is not in a loop. The next legitimate reload (minutes/hours
        // later) starts fresh.
        window.addEventListener("load", function () {
          setTimeout(function () {
            try {
              sessionStorage.setItem(KEY, "0");
              sessionStorage.setItem(TS_KEY, "0");
            } catch (e) {}
          }, 5000);
        });
      })();

      // BUILD VERSION STAMP — checked on every load to defeat stale SW caches.
      // Only reloads if the SERVER version is NEWER (not just different) and
      // only if the reload guard allows it.
      window.__BUILD_VERSION__ = "__BUILD_VERSION__";
      (function () {
        if (
          !window.__BUILD_VERSION__ ||
          window.__BUILD_VERSION__ === "__BUILD_VERSION__"
        )
          return;
        try {
          fetch("/version.json?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (data) {
              if (
                data &&
                data.version &&
                data.version !== window.__BUILD_VERSION__
              ) {
                // Only reload if the server version is NEWER. If the server
                // has an OLDER version (CDN cache lag during deploy), do NOT
                // reload — that would cause a loop (old version.json served
                // alongside new index.html).
                if (data.version > window.__BUILD_VERSION__) {
                  console.warn(
                    "[version-check] Server version " +
                      data.version +
                      " > client " +
                      window.__BUILD_VERSION__ +
                      " — updating",
                  );
                  if ("serviceWorker" in navigator) {
                    navigator.serviceWorker
                      .getRegistrations()
                      .then(function (regs) {
                        return Promise.all(
                          regs.map(function (r) {
                            return r.unregister();
                          }),
                        );
                      })
                      .then(function () {
                        window.__fuelproSafeReload("version-check-newer");
                      });
                  } else {
                    window.__fuelproSafeReload("version-check-newer");
                  }
                } else {
                  console.log(
                    "[version-check] Server version " +
                      data.version +
                      " <= client " +
                      window.__BUILD_VERSION__ +
                      " (CDN lag) — no reload",
                  );
                }
              }
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script>
      // Service Worker registration with automatic update handling.
      //
      // The custom public/sw.js is NETWORK-FIRST for navigations, so a fresh
      // index.html is fetched on every page load — deploys are visible
      // immediately. This script also:
      //   - registers on DOMContentLoaded (not waiting for full load) for speed
      //   - polls for SW updates every 5 min while the tab is open
      //   - auto-reloads on controllerchange (via safeReload — loop-guarded)
      //   - self-heals: if a script chunk 404s, unregisters the SW + reloads
      //     (via safeReload — max 1 retry per session, then shows error)
      if ("serviceWorker" in navigator) {
        var refreshing = false;
        navigator.serviceWorker.addEventListener(
          "controllerchange",
          function () {
            if (refreshing) return;
            refreshing = true;
            window.__fuelproSafeReload("sw-controllerchange");
          },
        );

        function checkForUpdate(reg) {
          reg.update().catch(function () {});
        }

        function handleUpdateFound(reg) {
          var newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener("statechange", function () {
            if (
              newWorker.state === "installed" &&
              navigator.serviceWorker.controller
            ) {
              // A new build is ready. Notify the app so it can show the
              // "New version available" banner (UpdateAvailableBanner)
              // instead of silently waiting for the next reload.
              try {
                window.dispatchEvent(new CustomEvent("fuelpro-sw-update"));
              } catch (e) {}
              newWorker.postMessage({ type: "SKIP_WAITING" });
            }
          });
        }

        function registerSW() {
          navigator.serviceWorker
            .register("/sw.js", { updateViaCache: "none" })
            .then(function (reg) {
              reg.addEventListener("updatefound", function () {
                handleUpdateFound(reg);
              });
              checkForUpdate(reg);
              // Poll for updates every 60 seconds while the tab is open so a
              // new deploy is picked up within a minute (was 5 minutes).
              setInterval(function () {
                checkForUpdate(reg);
              }, 60000);
            })
            .catch(function () {});
        }

        // Register as early as possible.
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", registerSW);
        } else {
          registerSW();
        }

        // Also check on pageshow (covers bfcache + tab reactivation).
        window.addEventListener("pageshow", function (event) {
          if (event.persisted) {
            navigator.serviceWorker.getRegistration().then(function (reg) {
              if (reg) checkForUpdate(reg);
            });
          }
        });

        // Honor a forced-reload message from the service worker (the new SW
        // posts FUELPRO_RELOAD on activate). Loop-guarded via safeReload.
        navigator.serviceWorker.addEventListener("message", function (event) {
          if (event.data && event.data.type === "FUELPRO_RELOAD") {
            window.__fuelproSafeReload("sw-fuelpro-reload");
          }
        });

        // Stale-SW self-heal: if a script chunk fails to load, unregister the
        // SW and reload so the browser fetches fresh assets. Loop-guarded:
        // safeReload limits this to MAX_RELOADS per session; if the chunk
        // still 404s after that, the user stays on the page (the React
        // ErrorBoundary will show a retry button instead of looping).
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (
              target &&
              target.tagName === "SCRIPT" &&
              target.src &&
              target.src.indexOf("/assets/") !== -1
            ) {
              console.warn(
                "[SW-heal] Script failed to load, unregistering SW + reloading:",
                target.src,
              );
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  return Promise.all(
                    regs.map(function (r) {
                      return r.unregister();
                    }),
                  );
                })
                .then(function () {
                  window.__fuelproSafeReload("sw-script-404");
                })
                .catch(function () {
                  window.__fuelproSafeReload("sw-script-404-fallback");
                });
            }
          },
          true,
        );
      }
    </script>
