apply plugin: 'com.android.application'

// The Cordova plugins pull older kotlin-stdlib-jdk7/jdk8 (1.6.x), which
// conflicts with the 1.8.22 stdlib used elsewhere — exclude the older ones.
configurations.all {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

android {
    namespace "com.fuelpro.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fuelpro.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is supplied only by the build environment/Gradle properties.
    // Never keep keystore passwords or private signing material in source control.
    def releaseStoreFile = project.findProperty("FUELPRO_RELEASE_STORE_FILE") ?: System.getenv("FUELPRO_RELEASE_STORE_FILE")
    def releaseStorePassword = project.findProperty("FUELPRO_RELEASE_STORE_PASSWORD") ?: System.getenv("FUELPRO_RELEASE_STORE_PASSWORD")
    def releaseKeyAlias = project.findProperty("FUELPRO_RELEASE_KEY_ALIAS") ?: System.getenv("FUELPRO_RELEASE_KEY_ALIAS")
    def releaseKeyPassword = project.findProperty("FUELPRO_RELEASE_KEY_PASSWORD") ?: System.getenv("FUELPRO_RELEASE_KEY_PASSWORD")
    def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && it.toString().trim() }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile.toString())
                storePassword releaseStorePassword.toString()
                keyAlias releaseKeyAlias.toString()
                keyPassword releaseKeyPassword.toString()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    logger.lifecycle("FuelPro Android release signing configured: " + hasReleaseSigning)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
