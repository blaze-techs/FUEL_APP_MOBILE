name: Autoformat FuelPro PR

on:
  push:
    branches:
      - feat/canonical-operations-all

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/canonical-operations-all
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply project Prettier rules
        run: npx prettier --write "src/**/*.{ts,tsx}" "*.{json,md}"

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src vercel.json package.json "*.md" 2>/dev/null || true
          git commit -m "style: apply project Prettier formatting"
          git push origin HEAD:feat/canonical-operations-all
