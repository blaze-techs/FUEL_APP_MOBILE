name: Build FuelPro Desktop and Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci can omit Rollup platform optional dependencies on Windows when
      # the lockfile was produced on Linux. Use npm install with optional deps
      # enabled so the native Windows Rollup binary is restored before Vite.
      # Verify afterwards and force-install the binary if npm still skipped it
      # (npm has a known bug with optional deps: npm/cli#4828).
      - run: npm install --legacy-peer-deps --include=optional
      - name: Ensure native Rollup binary for Windows
        shell: bash
        run: |
          if [ ! -d node_modules/@rollup/rollup-win32-x64-msvc ]; then
            echo "Native Rollup binary missing — installing explicitly"
            npm install --no-save --legacy-peer-deps @rollup/rollup-win32-x64-msvc
          fi
          test -d node_modules/@rollup/rollup-win32-x64-msvc
      - run: npm run build
      - run: npx electron-builder --win --x64 --ia32
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: FuelPro-Windows
          path: release/*

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx cap sync android
      - name: Validate Android release signing secrets
        id: signing
        env:
          FUELPRO_RELEASE_STORE_BASE64: ${{ secrets.FUELPRO_RELEASE_STORE_BASE64 }}
          FUELPRO_RELEASE_STORE_PASSWORD: ${{ secrets.FUELPRO_RELEASE_STORE_PASSWORD }}
          FUELPRO_RELEASE_KEY_ALIAS: ${{ secrets.FUELPRO_RELEASE_KEY_ALIAS }}
          FUELPRO_RELEASE_KEY_PASSWORD: ${{ secrets.FUELPRO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${FUELPRO_RELEASE_STORE_BASE64:-}" ] \
             && [ -n "${FUELPRO_RELEASE_STORE_PASSWORD:-}" ] \
             && [ -n "${FUELPRO_RELEASE_KEY_ALIAS:-}" ] \
             && [ -n "${FUELPRO_RELEASE_KEY_PASSWORD:-}" ]; then
            echo "$FUELPRO_RELEASE_STORE_BASE64" | base64 --decode > android/fuelpro.keystore
            test -s android/fuelpro.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release signing secrets are not set — falling back to an unsigned debug APK"
            rm -f android/fuelpro.keystore
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release APK
        working-directory: android
        env:
          FUELPRO_ANDROID_VERSION_CODE: ${{ github.run_number }}
          FUELPRO_ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          FUELPRO_RELEASE_STORE_PASSWORD: ${{ secrets.FUELPRO_RELEASE_STORE_PASSWORD }}
          FUELPRO_RELEASE_KEY_ALIAS: ${{ secrets.FUELPRO_RELEASE_KEY_ALIAS }}
          FUELPRO_RELEASE_KEY_PASSWORD: ${{ secrets.FUELPRO_RELEASE_KEY_PASSWORD }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease --no-daemon \
              -PFUELPRO_RELEASE_STORE_FILE="$GITHUB_WORKSPACE/android/fuelpro.keystore" \
              -PFUELPRO_RELEASE_STORE_PASSWORD="$FUELPRO_RELEASE_STORE_PASSWORD" \
              -PFUELPRO_RELEASE_KEY_ALIAS="$FUELPRO_RELEASE_KEY_ALIAS" \
              -PFUELPRO_RELEASE_KEY_PASSWORD="$FUELPRO_RELEASE_KEY_PASSWORD"
            ARTIFACT_DIR=app/build/outputs/apk/release
          else
            ./gradlew assembleDebug --no-daemon
            ARTIFACT_DIR=app/build/outputs/apk/debug
          fi
          ls -la "$ARTIFACT_DIR"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FuelPro-Android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: FuelPro-Windows
          path: release
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: FuelPro-Android
          path: release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
