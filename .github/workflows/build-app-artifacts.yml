name: Build FuelPro Desktop and Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci can omit Rollup platform optional dependencies on Windows when
      # the lockfile was produced on Linux. Use npm install with optional deps
      # enabled so the native Windows Rollup binary is restored before Vite.
      - run: npm install --legacy-peer-deps --include=optional
      - run: npm run build
      - run: npx electron-builder --win --x64 --ia32
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: FuelPro-Windows
          path: release/*

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx cap sync android
      - name: Build release APK
        working-directory: android
        env:
          FUELPRO_ANDROID_VERSION_CODE: ${{ github.run_number }}
          FUELPRO_ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FuelPro-Android
          path: android/app/build/outputs/apk/release/*.apk

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: FuelPro-Windows
          path: release
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: FuelPro-Android
          path: release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
