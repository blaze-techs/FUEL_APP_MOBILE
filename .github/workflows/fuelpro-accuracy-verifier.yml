name: FuelPro Accuracy Verifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuelpro-accuracy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Production build
        run: npm run build:vercel

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -s dist/index.html

      - name: Report verifier result
        if: always()
        run: |
          echo "FuelPro automated verifier completed with conclusion: ${{ job.status }}"
          echo "Checks: typecheck + unit tests + production build + artifact presence"
