name: Tighten scan confidence arithmetic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[scan-confidence-tightened]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tighten meter arithmetic tolerance
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/react-app/lib/sales-scan-parser.ts')
          s = p.read_text()
          old = 'function salesMatchesDelta(delta:number,written:number):boolean{return Math.abs(delta-written)<=Math.max(0.05,delta*0.0005);}'
          new = 'function salesMatchesDelta(delta:number,written:number):boolean{return Math.abs(delta-written)<=Math.max(0.05,delta*0.000001);}'
          if old not in s:
              raise SystemExit('sales tolerance anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify
        run: grep -q 'delta\*0.000001' src/react-app/lib/sales-scan-parser.ts
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tighten-scan-confidence.yml
          git add src/react-app/lib/sales-scan-parser.ts
          git add -u .github/workflows/tighten-scan-confidence.yml
          git commit -m 'fix: tighten scan confidence arithmetic tolerance [scan-confidence-tightened]'
          git push origin HEAD:main
