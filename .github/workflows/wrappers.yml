name: Build Wrappers (Desktop .exe + Android .apk)

# Every push to main rebuilds BOTH wrappers and publishes them to a
# continuously-updated GitHub Release ("wrappers-latest"). The desktop .exe
# auto-updater (electron-updater) reads from GitHub Releases, so users never
# have to re-download manually.
on:
  push:
    branches: [main]
  schedule:
    # Safety net: rebuild daily so the wrappers can never drift from the site.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrappers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-exe-and-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # electron-builder shells out to wine for rcedit (icon + version stamping)
      # and for the NSIS installer. On Ubuntu 24.04 the `wine`/`wine32:i386`
      # package names are unreliable, so try several candidates and record
      # whether we actually got a binary — the build step degrades gracefully
      # instead of dying with a bare `spawn wine ENOENT`.
      - name: Install Wine (for electron-builder signing on Linux)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          # Ubuntu 24.04: `wine64`/`wine32:i386` are the installable packages,
          # but NEITHER provides a `wine` command — only the `wine` metapackage
          # does. electron-builder shells out to literally `wine`, so without a
          # shim the install "succeeds" and the build then dies on
          # `spawn wine ENOENT`. Use the shim when the metapackage is absent.
          sudo apt-get install -y --no-install-recommends wine64 wine32:i386 \
            || sudo apt-get install -y --no-install-recommends wine \
            || echo "wine install failed; will build without rcedit"
          if ! command -v wine >/dev/null 2>&1 && [ -x /usr/bin/wine64 ]; then
            printf '#!/bin/sh\nexec /usr/bin/wine64 "$@"\n' | sudo tee /usr/local/bin/wine >/dev/null
            sudo chmod +x /usr/local/bin/wine
          fi
          if command -v wine >/dev/null 2>&1; then
            echo "WINE_AVAILABLE=1" >> "$GITHUB_ENV"
            wine --version || true
          else
            echo "WINE_AVAILABLE=0" >> "$GITHUB_ENV"
            echo "::warning::wine is unavailable — the .exe will build without its embedded icon/version metadata"
          fi

      # Install deps once (electron-updater is in dependencies so it is packaged).
      - run: npm ci --legacy-peer-deps

      # Stamp an increasing version (1.0.<run_number>) so the exe auto-updater
      # always sees a newer version than any previously installed build.
      - name: Stamp wrapper version
        run: npm version --no-git-tag-version "1.0.${{ github.run_number }}"

      - run: npm run build

      # Build the Windows .exe (NSIS installer + portable + latest.yml feed).
      # rcedit (icon/version stamping) and NSIS both shell out to wine. When
      # wine is unavailable the build cannot stamp metadata, so two things
      # happen: the main electron namespace (the `build.win.signAndEditExecutable`
      # escape hatch) is disabled, and if NSIS still insists on wine we fall
      # back to the portable target only — still a runnable .exe and still a
      # valid latest.yml feed, rather than a red workflow.
      - name: Build desktop .exe (electron-builder)
        run: |
          # Default artifact feeds are NOT prebuilt (the REST API cannot upload
          # arbitrary files); this builds locally and uploads explicit paths.
          # ALWAYS start from an empty release/ — a failed first pass leaves a
          # truncated installer behind, which would then be published as a
          # "valid" 0.2 MB artifact.
          rm -rf release && mkdir -p release
          if [ "${WINE_AVAILABLE:-0}" = "1" ]; then
            npx electron-builder --win --x64 --publish never
          else
            echo "::notice::building without wine — rcedit disabled"
            npx electron-builder --win --x64 -c.win.signAndEditExecutable=false \
              --publish never || {
                echo "::warning::NSIS needs wine; falling back to the portable target"
                rm -rf release && mkdir -p release
                npx electron-builder --win portable --x64 \
                  -c.win.signAndEditExecutable=false --publish never
              }
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build the Android .apk (Capacitor remote wrapper).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages (uses the runner's preinstalled SDK)
        run: |
          # The ubuntu-latest runner ships an Android SDK at ANDROID_HOME
          # (default /usr/local/lib/android/sdk). Install ONLY the packages we
          # need into THAT location so gradle doesn't get conflicting SDK paths.
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Generate self-signed keystore (self-contained CI)
        run: |
          keytool -genkeypair -v \
            -keystore android/fuelpro.keystore \
            -alias fuelpro -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass fuelpro-secret -keypass fuelpro-secret \
            -dname "CN=FuelPro, OU=Mobile, O=FuelPro, L=Nairobi, S=Nairobi, C=KE"
      - name: Build Android .apk (Capacitor)
        run: |
          npx cap sync android
          cd android
          # The keystore generated above must be handed to Gradle explicitly.
          # Without these properties `hasReleaseSigning` is false, the release
          # variant is left unsigned and AGP emits NO app-release.apk at all.
          ./gradlew assembleRelease assembleDebug \
            -PFUELPRO_RELEASE_STORE_FILE="$GITHUB_WORKSPACE/android/fuelpro.keystore" \
            -PFUELPRO_RELEASE_STORE_PASSWORD=fuelpro-secret \
            -PFUELPRO_RELEASE_KEY_ALIAS=fuelpro \
            -PFUELPRO_RELEASE_KEY_PASSWORD=fuelpro-secret
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          [ -n "$APK" ] || { echo "no release APK produced"; exit 1; }
          cp "$APK" ../release/FuelPro.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../release/FuelPro-debug.apk
      - name: Publish wrappers to the continuously-updated release
        run: |
          gh release delete wrappers-latest --yes 2>/dev/null || true
          # `nsis.artifactName` is space-free, so the files on disk already
          # carry the exact names latest.yml references — no renaming, and no
          # gh space->dot rewrite that would 404 the auto-update download.
          assets=()
          for f in release/*.exe release/latest.yml release/*.blockmap \
                   release/FuelPro.apk release/FuelPro-debug.apk; do
            [ -f "$f" ] && assets+=("$f")
          done
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no wrapper artifacts were produced"; exit 1
          fi
          # The .exe auto-updater only works when latest.yml was generated.
          # That requires a successful NSIS build (which needs wine).
          if ! ls release/latest.yml >/dev/null 2>&1; then
            echo "::warning::latest.yml was not generated — the .exe auto-updater will be inert until wine is available in CI"
          fi
          echo "Publishing: ${assets[*]}"
          gh release create wrappers-latest "${assets[@]}" \
            --title "FuelPro — always-fresh Wrappers (auto-built)" \
            --notes "Auto-built on every main push. The .exe auto-updater reads latest.yml from this release; the .apk loads the live site. Install once, always up-to-date. Built automatically by FuelPro CI."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
