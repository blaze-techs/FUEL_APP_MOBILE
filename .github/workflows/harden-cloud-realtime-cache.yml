name: Harden realtime cache scope

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[realtime-cache-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch realtime cache scoping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/react-app/lib/cloud-storage-service.ts')
          s = p.read_text()
          old = '''            const id = row?.id ?? "";\n            if (!id) return;\n            // Invalidate any memory cache entry for this row.\n            for (const [ck] of this.memoryCache) {\n              if (id.includes(ck.split("__")[0])) {\n                this.memoryCache.delete(ck);\n              }\n            }\n            const rawValue = (payload.new as { data?: unknown })?.data ?? null;\n            const decoded = rawValue == null ? null : decodeRow(rawValue);\n            if (decoded != null) {\n              writeCache(id, decoded, currentUserIdSync() || "anonymous");\n            } else {\n              clearCache(id, currentUserIdSync() || "anonymous");\n            }'''
          new = '''            const id = row?.id ?? "";\n            if (!id) return;\n            const rowOwnerId =\n              typeof row?.owner_id === "string"\n                ? row.owner_id\n                : currentUserIdSync() || "anonymous";\n            const rowStationId =\n              typeof row?.station_id === "string" ? row.station_id : undefined;\n            // Invalidate only the exact owner/station cache scope. The previous\n            // substring scan could invalidate unrelated keys and wrote realtime\n            // updates into the unscoped cache, allowing cross-station bleed.\n            const exactCacheKey = scopedCacheKey(id, rowOwnerId, rowStationId);\n            this.memoryCache.delete(exactCacheKey);\n            const rawValue = (payload.new as { data?: unknown })?.data ?? null;\n            const decoded = rawValue == null ? null : decodeRow(rawValue);\n            if (decoded != null) {\n              writeCache(id, decoded, rowOwnerId, rowStationId);\n            } else {\n              clearCache(id, rowOwnerId, rowStationId);\n            }'''
          if old not in s:
              raise SystemExit('Expected realtime callback block was not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/harden-cloud-realtime-cache.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/react-app/lib/cloud-storage-service.ts .github/workflows/harden-cloud-realtime-cache.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: scope realtime cache invalidation [realtime-cache-fixed]'
          git push
