name: Backup and Disaster Recovery

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate backup secrets
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::SUPABASE_DB_URL is required"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_KEY" || { echo "::error::BACKUP_ENCRYPTION_KEY is required"; exit 1; }

      - name: Create public-schema backup
        run: |
          mkdir -p backup
          pg_dump "$SUPABASE_DB_URL"             --format=custom             --schema=public             --no-owner             --no-acl             --file=backup/fuelpro-public.dump
          sha256sum backup/fuelpro-public.dump > backup/fuelpro-public.dump.sha256

      - name: Restore drill into clean PostgreSQL
        run: |
          createdb -h 127.0.0.1 -U postgres fuelpro_restore
          psql -h 127.0.0.1 -U postgres -d fuelpro_restore <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users(id uuid primary key, email text);
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$ SELECT 'authenticated'::text $$;
          SQL
          pg_restore -h 127.0.0.1 -U postgres -d fuelpro_restore             --no-owner --no-acl --exit-on-error backup/fuelpro-public.dump
          psql -h 127.0.0.1 -U postgres -d fuelpro_restore -v ON_ERROR_STOP=1 <<'SQL'
          DO $
          BEGIN
            IF to_regclass('public.sales_ledger') IS NULL THEN
              RAISE EXCEPTION 'sales_ledger missing after restore';
            END IF;
            IF to_regclass('public.operational_shifts') IS NULL THEN
              RAISE EXCEPTION 'operational_shifts missing after restore';
            END IF;
          END $;
          SELECT COUNT(*) AS restored_sales_rows FROM public.sales_ledger;
          SELECT COUNT(*) AS restored_shift_rows FROM public.operational_shifts;
          SQL

      - name: Encrypt backup before artifact upload
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt             -pass env:BACKUP_ENCRYPTION_KEY             -in backup/fuelpro-public.dump             -out backup/fuelpro-public.dump.enc
          rm -f backup/fuelpro-public.dump

      - name: Upload encrypted disaster-recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuelpro-db-backup-${{ github.run_id }}
          path: |
            backup/fuelpro-public.dump.enc
            backup/fuelpro-public.dump.sha256
          retention-days: 30
          if-no-files-found: error
