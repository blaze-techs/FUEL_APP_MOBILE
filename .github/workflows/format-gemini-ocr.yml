name: Format Gemini OCR changes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[gemini-ocr-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write api/gemini-ocr.ts functions/api/gemini-ocr.ts src/react-app/lib/gemini-vision-ocr.ts src/react-app/lib/ocr-service.ts src/utils/apiConfig.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/gemini-ocr.ts functions/api/gemini-ocr.ts src/react-app/lib/gemini-vision-ocr.ts src/react-app/lib/ocr-service.ts src/utils/apiConfig.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format Gemini OCR integration [gemini-ocr-formatted]"
          git push origin main
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/format-gemini-ocr.yml || true
          git commit -m "chore: remove one-shot Gemini OCR formatter [gemini-ocr-formatted]" || true
          git push origin main || true
