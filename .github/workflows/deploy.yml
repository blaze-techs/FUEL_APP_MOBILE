name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  # Vercel account "leonnovic" belongs to multiple teams; the CLI cannot
  # auto-select one in a non-interactive terminal. Pin to the fuel-app-mobile
  # team (orgId team_HvnupSUe9C1kfvUEQ5LFXOju in .vercel/project.json).
  VERCEL_SCOPE: leons-projects-78a92c96

jobs:
  # Production + preview deploys to Vercel are handled natively by the Vercel
  # GitHub integration (the project is git-linked to blaze-techs/FUEL_APP_MOBILE).
  # Keeping Vercel deploy as the single source avoids doubling deployment
  # storage usage on every push. If the Vercel git link is ever removed,
  # re-add the CLI deploy step from git history.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --title "Release v${{ github.run_number }}" \
            --notes "Automatically generated by FuelPro CI." \
            --draft || true


  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping Cloudflare deploy. Add it under Settings → Secrets and variables → Actions to enable auto-deploy."
            exit 0
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          fi
          npx wrangler pages deploy dist --project-name=fuel-app-mobile --branch=main


  deploy-cloudflare-email:
    name: Deploy Cloudflare Email Router
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy email Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPPORT_FORWARD_TO: ${{ secrets.FUELPRO_SUPPORT_FORWARD_TO }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare credentials unavailable — skipping email Worker deploy."
            exit 0
          fi
          if [ -z "$SUPPORT_FORWARD_TO" ]; then
            echo "::notice::FUELPRO_SUPPORT_FORWARD_TO is not set — skipping email Worker deploy to avoid dropping inbound mail."
            exit 0
          fi
          npx wrangler deploy --config workers/email-router/wrangler.toml --var SUPPORT_FORWARD_TO:"$SUPPORT_FORWARD_TO"


  verify-deploy:
    name: Verify Deployments
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release, deploy-cloudflare, deploy-cloudflare-email]
    steps:
      - name: Check Vercel production
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://fuel-app-mobile.vercel.app/)
          echo "vercel.app -> HTTP $code"
          [ "$code" = "200" ] || exit 1
      - name: Check Cloudflare Pages
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://fuel-app-mobile.pages.dev/)
          echo "pages.dev -> HTTP $code"
          [ "$code" = "200" ] || exit 1
