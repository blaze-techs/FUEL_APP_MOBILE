name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  VERCEL_SCOPE: leons-projects-78a92c96

concurrency:
  group: fuelpro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --title "Release v${{ github.run_number }}" \
            --notes "Automatically generated by FuelPro CI." \
            --draft || true

  deploy-vercel:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Deploy current commit to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_HvnupSUe9C1kfvUEQ5LFXOju
          VERCEL_PROJECT_ID: prj_hjVrMLO7CxLTI77kthGE020eI3oj
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN GitHub Actions secret is missing; Vercel production cannot be updated safely."
            exit 1
          fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA"

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE GitHub Actions secret is missing; Cloudflare production cannot be updated safely."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID GitHub Actions secret is missing."
            exit 1
          fi
          npx wrangler pages deploy dist --project-name=fuel-app-mobile --branch=main

  verify-deploy:
    name: Verify exact commit on production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release, deploy-cloudflare, deploy-vercel]
    steps:
      - name: Verify Vercel HTTP and exact commit
        run: |
          set -euo pipefail
          code=$(curl -fsS -o /dev/null -w "%{http_code}" https://fuel-app-mobile.vercel.app/)
          echo "vercel.app -> HTTP $code"
          test "$code" = "200"
          actual=$(curl -fsS https://fuel-app-mobile.vercel.app/version.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "vercel version -> $actual"
          test "$actual" = "${GITHUB_SHA}"
      - name: Verify Cloudflare HTTP and exact commit
        run: |
          set -euo pipefail
          code=$(curl -fsS -o /dev/null -w "%{http_code}" https://fuel-app-mobile.pages.dev/)
          echo "pages.dev -> HTTP $code"
          test "$code" = "200"
          actual=$(curl -fsS https://fuel-app-mobile.pages.dev/version.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "pages.dev version -> $actual"
          test "$actual" = "${GITHUB_SHA}"
