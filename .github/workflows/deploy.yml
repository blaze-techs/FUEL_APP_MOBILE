name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  # Vercel account "leonnovic" belongs to multiple teams; the CLI cannot
  # auto-select one in a non-interactive terminal. Pin to the fuel-app-mobile
  # team (orgId team_HvnupSUe9C1kfvUEQ5LFXOju in .vercel/project.json).
  VERCEL_SCOPE: leons-projects-78a92c96

jobs:
  # Vercel production is deployed explicitly from this workflow. This keeps
  # GitHub/Cloudflare/Vercel on the exact same commit and avoids leaving
  # production stuck on an older failed Git-integration deployment.
  # The Vercel token is read only from GitHub Actions secrets.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --title "Release v${{ github.run_number }}" \
            --notes "Automatically generated by FuelPro CI." \
            --draft || true




  deploy-vercel:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Deploy current commit to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_HvnupSUe9C1kfvUEQ5LFXOju
          VERCEL_PROJECT_ID: prj_hjVrMLO7CxLTI77kthGE020eI3oj
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN GitHub Actions secret is missing; Vercel production cannot be updated safely."
            exit 1
          fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping Cloudflare deploy. Add it under Settings → Secrets and variables → Actions to enable auto-deploy."
            exit 0
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          fi
          npx wrangler pages deploy dist --project-name=fuel-app-mobile --branch=main

  verify-deploy:
    name: Verify Deployments
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release, deploy-cloudflare, deploy-vercel]
    steps:
      - name: Check Vercel production
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://fuel-app-mobile.vercel.app/)
          echo "vercel.app -> HTTP $code"
          [ "$code" = "200" ] || exit 1
      - name: Check Cloudflare Pages
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://fuel-app-mobile.pages.dev/)
          echo "pages.dev -> HTTP $code"
          [ "$code" = "200" ] || exit 1
