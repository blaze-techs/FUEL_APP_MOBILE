name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  # Vercel account "leonnovic" belongs to multiple teams; the CLI cannot
  # auto-select one in a non-interactive terminal. Pin to the fuel-app-mobile
  # team (orgId team_HvnupSUe9C1kfvUEQ5LFXOju in .vercel/project.json).
  VERCEL_SCOPE: leons-projects-78a92c96

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL }} --scope=${{ env.VERCEL_SCOPE }}

      - name: Build Project
        run: vercel build --token=${{ secrets.VERCEL }} --scope=${{ env.VERCEL_SCOPE }}

      - name: Deploy to Vercel (Preview)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --yes --token=${{ secrets.VERCEL }} --scope=${{ env.VERCEL_SCOPE }})
          echo "preview-url=$url" >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployed to: ${{ steps.deploy.outputs.preview-url }}'
            })

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    # Vercel links a deployment created inside a git repo to a GitHub
    # deployment. If the Vercel GitHub App is not (re-)authorized for the
    # current org/repo, that produces a BLOCKED deployment and the CLI hangs.
    # Fix: build in the checked-out repo, then deploy from a COPY that has no
    # .git directory so Vercel creates an unlinked (READY) deployment, and
    # explicitly (`--yes`) alias it to the production domain.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL }} --scope=${{ env.VERCEL_SCOPE }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL }} --scope=${{ env.VERCEL_SCOPE }}

      - name: Deploy to Vercel (Production)
        id: deploy
        run: |
          rm -rf /tmp/vc-deploy && mkdir -p /tmp/vc-deploy/.vercel
          cp -r .vercel/output /tmp/vc-deploy/.vercel/output
          cp -r .vercel/project.json /tmp/vc-deploy/.vercel/project.json 2>/dev/null || true
          cd /tmp/vc-deploy
          url=$(vercel deploy --prebuilt --prod --yes \
            --token=${{ secrets.VERCEL }} --scope=${{ env.VERCEL_SCOPE }})
          echo "production-url=$url" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --title "Release v${{ github.run_number }}" \
            --notes "Auto-generated by CI (OpenHands)." \
            --draft || true

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping Cloudflare deploy. Add it under Settings → Secrets and variables → Actions to enable auto-deploy."
            exit 0
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          fi
          npx wrangler pages deploy dist --project-name=fuel-app-mobile --branch=main

  verify-deploy:
    name: Verify Deployments
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-production, deploy-cloudflare]
    steps:
      - name: Check Vercel production
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://fuel-app-mobile.vercel.app/)
          echo "vercel.app -> HTTP $code"
          [ "$code" = "200" ] || exit 1
      - name: Check Cloudflare Pages
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://fuel-app-mobile.pages.dev/)
          echo "pages.dev -> HTTP $code"
          [ "$code" = "200" ] || exit 1
