name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  # Vercel account "leonnovic" belongs to multiple teams; the CLI cannot
  # auto-select one in a non-interactive terminal. Pin to the fuel-app-mobile
  # team (orgId team_HvnupSUe9C1kfvUEQ5LFXOju in .vercel/project.json).
  VERCEL_SCOPE: leons-projects-78a92c96

jobs:
  # Production + preview deploys to Vercel are handled natively by the Vercel
  # GitHub integration (the project is git-linked to blaze-techs/FUEL_APP_MOBILE).
  # Keeping Vercel deploy as the single source avoids doubling deployment
  # storage usage on every push. If the Vercel git link is ever removed,
  # re-add the CLI deploy step from git history.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --title "Release v${{ github.run_number }}" \
            --notes "Automatically generated by FuelPro CI." \
            --draft || true


  build-desktop-mobile:
    name: Build APK + EXE release artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Build Windows EXE
        run: npm run electron:build

      - name: Build Android APK
        run: npm run cap:build

      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          find dist -maxdepth 2 -type f -name '*.exe' -o -name '*.msi' 2>/dev/null | xargs -r -I{} cp "{}" release-assets/
          find release -maxdepth 2 -type f -name '*.exe' -o -name '*.msi' 2>/dev/null | xargs -r -I{} cp "{}" release-assets/
          find android/app/build/outputs/apk/release -type f -name '*.apk' -exec cp "{}" release-assets/ \;
          ls -lah release-assets
          test -n "$(find release-assets -type f | head -1)"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ github.run_number }}
        run: gh release upload "$TAG" release-assets/* --clobber

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping Cloudflare deploy. Add it under Settings → Secrets and variables → Actions to enable auto-deploy."
            exit 0
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          fi
          npx wrangler pages deploy dist --project-name=fuel-app-mobile --branch=main

  verify-deploy:
    name: Verify Deployments
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release, deploy-cloudflare]
    steps:
      - name: Check Vercel production
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://fuel-app-mobile.vercel.app/)
          echo "vercel.app -> HTTP $code"
          [ "$code" = "200" ] || exit 1
      - name: Check Cloudflare Pages
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://fuel-app-mobile.pages.dev/)
          echo "pages.dev -> HTTP $code"
          [ "$code" = "200" ] || exit 1
