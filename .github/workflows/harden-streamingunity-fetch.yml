name: Harden streaming upstream fetch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[streaming-fetch-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch upstream timeout and retry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server/vercel-api/_lib/streamingunity.ts')
          s = p.read_text()
          old = '''export async function fetchSuPage(path: string): Promise<any> {\n  const url = path.startsWith("http") ? path : `${SU_BASE}${path}`;\n  const res = await fetch(url, {\n    headers: {\n      "User-Agent": UA,\n      Accept: "text/html,application/xhtml+xml",\n      "Accept-Language": "en-US,en;q=0.9",\n    },\n  });\n  if (!res.ok) return null;\n  const html = await res.text();\n  return parseDataPage(html);\n}'''
          new = '''export async function fetchSuPage(path: string): Promise<any> {\n  const url = path.startsWith("http") ? path : `${SU_BASE}${path}`;\n  const headers = {\n    "User-Agent": UA,\n    Accept: "text/html,application/xhtml+xml",\n    "Accept-Language": "en-US,en;q=0.9",\n  };\n\n  // Third-party catalog calls must never consume the full serverless timeout.\n  // Retry transient network/5xx failures twice, but cap each attempt at 8s.\n  for (let attempt = 0; attempt < 3; attempt += 1) {\n    const controller = new AbortController();\n    const timeout = setTimeout(() => controller.abort(), 8_000);\n    try {\n      const res = await fetch(url, { headers, signal: controller.signal });\n      if (res.ok) {\n        const html = await res.text();\n        return parseDataPage(html);\n      }\n      if (res.status >= 400 && res.status < 500) return null;\n    } catch {\n      // Retry only transient failures. The route returns its normal empty\n      // payload when all attempts fail, rather than timing out for 300s.\n    } finally {\n      clearTimeout(timeout);\n    }\n    if (attempt < 2) await new Promise((resolve) => setTimeout(resolve, 250 * 2 ** attempt));\n  }\n  return null;\n}'''
          if old not in s:
              raise SystemExit('Expected fetchSuPage block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/harden-streamingunity-fetch.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/vercel-api/_lib/streamingunity.ts .github/workflows/harden-streamingunity-fetch.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: bound streaming upstream requests [streaming-fetch-hardened]'
          git push
