name: Fix AI sales scan accuracy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[ai-sales-scan-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch parser, OCR and auto-apply
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Parser: validate the exact 3-line handwritten pump pattern.
          p = Path('src/react-app/lib/sales-scan-parser.ts')
          s = p.read_text()
          old = '''  // Handwritten unlabeled two-line pump blocks.\n  for (let i = 0; i < lines.length - 1; i++) {\n    const first = meterPairFromLine(lines[i]);\n    const second = meterPairFromLine(lines[i + 1]);\n    if (!first || !second) continue;\n    const [openingKsh, openingLitres] = first;\n    const [closingKsh, closingLitres] = second;\n    addUniquePump(\n      pumps,\n      buildPump(\n        `SCAN-${pumps.length + 1}`,\n        "",\n        openingKsh,\n        closingKsh,\n        openingLitres,\n        closingLitres,\n        "high",\n      ),\n    );\n    i++;\n  }\n'''
          new = '''  // Handwritten unlabeled pump blocks are three lines:\n  // opening KSh - opening litres\n  // closing KSh - closing litres\n  // sales KSh\n  // Requiring the third line and validating its arithmetic prevents expense\n  // lines and unrelated numbers from being misclassified as pumps.\n  const numericValuesIncludingZero = (line: string): number[] =>\n    numericGroups(line).map(toNumber).filter((n) => Number.isFinite(n) && n >= 0);\n  const salesMatchesMeterDelta = (delta: number, written: number): boolean =>\n    Math.abs(delta - written) <= Math.max(0.05, delta * 0.0005);\n\n  for (let i = 0; i < lines.length - 2; i++) {\n    const first = meterPairFromLine(lines[i]);\n    const second = meterPairFromLine(lines[i + 1]);\n    if (!first || !second) continue;\n    const salesValues = numericValuesIncludingZero(lines[i + 2]);\n    if (salesValues.length !== 1) continue;\n\n    const [openingKsh, openingLitres] = first;\n    const [closingKsh, closingLitres] = second;\n    const writtenSales = salesValues[0];\n    if (!salesMatchesMeterDelta(Math.abs(closingKsh - openingKsh), writtenSales)) continue;\n\n    const pump = buildPump(\n      `SCAN-${pumps.length + 1}`,\n      "",\n      openingKsh,\n      closingKsh,\n      openingLitres,\n      closingLitres,\n      "high",\n    );\n    pump.salesAmount = writtenSales;\n    addUniquePump(pumps, pump);\n    i += 2;\n  }\n'''
          if old not in s: raise SystemExit('parser pump block anchor missing')
          s = s.replace(old, new, 1)

          old = '''    completePumps.length > 0 &&\n    completePumps.length === pumps.length &&\n    date &&\n    totalAgreesWithMeters &&\n'''
          new = '''    completePumps.length >= 2 &&\n    completePumps.length === pumps.length &&\n    totalAgreesWithMeters &&\n'''
          if old not in s: raise SystemExit('parser confidence anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) OCR: add a numeric-only pass for meter/till/sales numbers.\n          # Normal OCR remains for labels; numeric OCR is additional evidence.
          o = Path('src/react-app/lib/ocr-service.ts')
          s = o.read_text()
          old = '''          const result = await worker.recognize(target, {\n            tessedit_pageseg_mode: psm,\n            preserve_interword_spaces: "1",\n          });\n          const text = result.data.text || "";\n          if (text.trim()) texts.push(text);\n'''
          new = '''          const result = await worker.recognize(target, {\n            tessedit_pageseg_mode: psm,\n            preserve_interword_spaces: "1",\n          });\n          const text = result.data.text || "";\n          if (text.trim()) texts.push(text);\n\n          // Numeric-only recognition is intentionally additive. It prevents\n          // handwriting such as 65 021 771.32 / 458 624.82 from being lost\n          // when Tesseract interprets digits as letters, while the normal\n          // pass still supplies fuel/expense labels.\n          if (target === enhanceHandwritingCanvas(source) && (psm === "4" || psm === "6")) {\n            try {\n              const numeric = await worker.recognize(target, {\n                tessedit_pageseg_mode: psm,\n                preserve_interword_spaces: "1",\n                tessedit_char_whitelist: "0123456789.,:-=",\n                classify_bln_numeric_mode: "1",\n              });\n              const numericText = numeric.data.text || "";\n              if (numericText.trim()) texts.push(numericText);\n            } catch {\n              // Keep the successful normal OCR pass.\n            }\n          }\n'''
          # Avoid the identity comparison above (new canvas each call) by use a safer replacement below.
          new = '''          const result = await worker.recognize(target, {\n            tessedit_pageseg_mode: psm,\n            preserve_interword_spaces: "1",\n          });\n          const text = result.data.text || "";\n          if (text.trim()) texts.push(text);\n\n          // Numeric-only recognition is additive evidence for handwritten\n          // meter/KSh/litre rows. It is run only on the enhanced target.\n          if (target === targets[1] && (psm === "4" || psm === "6")) {\n            try {\n              const numeric = await worker.recognize(target, {\n                tessedit_pageseg_mode: psm,\n                preserve_interword_spaces: "1",\n                tessedit_char_whitelist: "0123456789.,:-=",\n                classify_bln_numeric_mode: "1",\n              });\n              const numericText = numeric.data.text || "";\n              if (numericText.trim()) texts.push(numericText);\n            } catch {\n              // Keep the successful normal OCR pass.\n            }\n          }\n'''
          if old not in s: raise SystemExit('OCR anchor missing')
          s = s.replace(old, new, 1)
          o.write_text(s)

          # 3) Auto-apply only verified HIGH-confidence scans.
          st = Path('src/react-app/components/SalesTracking.tsx')
          s = st.read_text()
          old = '  const applyScannedData = () => {\n    const data = editableResult || scanResult;'
          new = '  const applyScannedData = (override?: ScanResultData) => {\n    const data = override || editableResult || scanResult;'
          if old in s:
              s = s.replace(old, new, 1)
          old = '''      setScanResult(extractedData);\n      setEditableResult(JSON.parse(JSON.stringify(extractedData))); // Deep copy for editing\n      setScanStep("review");\n'''
          new = '''      setScanResult(extractedData);\n      setEditableResult(JSON.parse(JSON.stringify(extractedData))); // Deep copy for editing\n\n      // High confidence means the parser independently validated the meter\n      // arithmetic. Apply those values directly to the actual Sales Tracking\n      // form; uncertain scans remain in Review.\n      if (extractedData.confidence === "high") {\n        applyScannedData(extractedData);\n      } else {\n        setScanStep("review");\n      }\n'''
          if old in s:
              s = s.replace(old, new, 1)
          old = '    toastSuccess("Data applied successfully! Review and adjust as needed.");\n'
          new = '    toastSuccess("Verified scan applied automatically. Review the populated Sales Tracking fields before saving.");\n'
          if old in s:
              s = s.replace(old, new, 1)
          st.write_text(s)
          PY
      - name: Verify patches
        run: |
          grep -q 'salesMatchesMeterDelta' src/react-app/lib/sales-scan-parser.ts
          grep -q 'tessedit_char_whitelist' src/react-app/lib/ocr-service.ts
          grep -q 'applyScannedData(override' src/react-app/components/SalesTracking.tsx
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-ai-sales-scan.yml
          git add src/react-app/lib/sales-scan-parser.ts src/react-app/lib/ocr-service.ts src/react-app/components/SalesTracking.tsx
          git add -u .github/workflows/fix-ai-sales-scan.yml
          git commit -m 'fix: high-accuracy handwritten sales OCR and auto-apply [ai-sales-scan-fix]'
          git push origin HEAD:main
