name: Apply AI scan field autofill fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source fix
        run: python tools/autofix_ai_scan_fields.py
      - name: Commit source fix and remove one-shot files
        run: |
          if git diff --quiet -- src/react-app/components/SalesTracking.tsx src/react-app/lib/sales-scan-parser.ts; then
            echo "No source changes were produced."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/autofix_ai_scan_fields.py .github/workflows/apply-ai-scan-fields-fix.yml
          git add src/react-app/components/SalesTracking.tsx src/react-app/lib/sales-scan-parser.ts
          git add -u tools/autofix_ai_scan_fields.py .github/workflows/apply-ai-scan-fields-fix.yml
          git commit -m 'fix: auto-fill scanned tanks prices and explicit pumps [ai-scan-fields-autofix]'
          git push origin HEAD:main
