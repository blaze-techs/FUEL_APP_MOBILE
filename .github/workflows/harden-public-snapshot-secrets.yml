name: Harden public station snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[snapshot-secret-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove sensitive fields from public snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server/vercel-api/_lib/station-snapshot-for-grant.ts')
          s = p.read_text()
          old = '''    companyData: {\n      name: str(compactCompany.name) || "Station",\n      phone: str(compactCompany.contacts),\n      email: str(compactCompany.email),\n      kraPin: str(compactCompany.kraPin),\n      vatNumber: str(compactCompany.vatRegNo),\n    },'''
          new = '''    // Public/shared snapshots must never contain credentials, tax PINs or\n    // other account-level secrets. Contact details are gated below by the\n    // communication tab; compliance identifiers are deliberately excluded.\n    companyData: {\n      name: str(compactCompany.name) || "Station",\n    },'''
          if old not in s:
              raise SystemExit('Expected public companyData block not found')
          s = s.replace(old, new)
          marker = '''    payments: gate(["mpesa", "livetransaction"], payments),'''
          replacement = '''    payments: gate(["mpesa", "livetransaction"], payments),\n    companyData: effective.has("communication")\n      ? {\n          name: str(compactCompany.name) || "Station",\n          phone: str(compactCompany.contacts),\n          email: str(compactCompany.email),\n        }\n      : { name: str(compactCompany.name) || "Station" },'''
          if marker not in s:
              raise SystemExit('Expected snapshot gating marker not found')
          p.write_text(s.replace(marker, replacement))
          PY
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/harden-public-snapshot-secrets.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/vercel-api/_lib/station-snapshot-for-grant.ts .github/workflows/harden-public-snapshot-secrets.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove sensitive fields from public snapshots [snapshot-secret-hardened]'
          git push
