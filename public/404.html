<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="The page you are looking for does not exist. Return to FuelPro — the all-in-one fuel station management platform."
    />
    <title>Page Not Found — FuelPro</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://fuelpropay.com/404" />
    <style>
      :root {
        --bg: #0a0e17;
        --card: #111625;
        --border: #2d3748;
        --gold: #c5a059;
        --gold-hover: #d4b475;
        --text: #f9fafb;
        --text-dim: #a1a1aa;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 48px 40px;
        max-width: 520px;
        width: 100%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        margin: 0 auto 20px;
        display: block;
      }
      .code {
        font-size: 56px;
        font-weight: 800;
        color: var(--gold);
        letter-spacing: 2px;
        line-height: 1;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 12px 0 8px;
      }
      p {
        color: var(--text-dim);
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .btn {
        display: inline-block;
        padding: 13px 22px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s ease;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: var(--gold);
        color: #0a0e17;
      }
      .btn-primary:hover {
        background: var(--gold-hover);
      }
      .btn-secondary {
        background: transparent;
        color: var(--text);
        border-color: var(--border);
      }
      .btn-secondary:hover {
        border-color: var(--gold);
      }
      .links {
        margin-top: 26px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 18px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .links a {
        color: var(--text-dim);
        font-size: 13px;
        text-decoration: none;
      }
      .links a:hover {
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <main class="card" aria-labelledby="notfound-title">
      <img
        class="logo"
        src="/icon-192.png"
        alt="FuelPro logo"
        width="72"
        height="72"
      />
      <div class="code">404</div>
      <h1 id="notfound-title">Page not found</h1>
      <p>
        The page you are looking for doesn't exist or may have been moved.
        Head back to FuelPro to manage your fuel station.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Go to Dashboard</a>
        <a class="btn btn-secondary" href="/#/sign-in">Sign in</a>
      </div>
      <nav class="links" aria-label="Helpful links">
        <a href="/">Home</a>
        <a href="/#/sign-up">Create account</a>
        <a href="/#/station-access">Station access</a>
        <a href="https://fuelpropay.com/sitemap.xml">Sitemap</a>
      </nav>
    </main>
  </body>
</html>
